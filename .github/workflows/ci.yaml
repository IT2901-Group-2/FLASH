name: CI/CD Pipeline

on:
  push:

jobs:
  pipeline:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
