name: CI/CD Pipeline

on:
  push:

jobs:
  pipeline:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm run setup

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
